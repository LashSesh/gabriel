[workspace]
members = [
    "gabriel-core",
    "trichter-geometry",
    "metabolics",
    "emergence",
    "organism", "mathematical-cognition",
    "fusion-layer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Klemm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/gabriel-organism"

[workspace.dependencies]
# Core dependencies
nalgebra = "0.33"
ndarray = "0.16"
num-traits = "0.2"
num-complex = "0.4"

# Async & Performance
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Random & Hashing
rand = "0.8"
rand_distr = "0.4"
ahash = "0.8"
seahash = "4.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Math & Statistics
approx = "0.5"
statrs = "0.17"

# Time handling
chrono = "0.4"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
